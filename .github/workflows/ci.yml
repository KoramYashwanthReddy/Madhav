name: MAX Platform CI / Infrastructure Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type Check with Mypy
        run: mypy

  backend-test-suite:
    name: Pytest Unit & Integration Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pytest-cov

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: pytest --cov=src/max tests/

  frontend-build-check:
    name: Web & Admin Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application (Module 35)
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Admin Console (Module 37)
        run: |
          cd admin
          npm ci
          npm run build

  container-security-scan:
    name: Docker Image Build & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: max-backend:ci-${{ github.sha }}

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: max-web:ci-${{ github.sha }}

      - name: Build Admin Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.admin
          push: false
          tags: max-admin:ci-${{ github.sha }}
