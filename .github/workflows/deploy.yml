name: MAX Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Production Deployment & Verification
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log Deployment Action
        run: |
          echo "Starting MAX Deployment to ${{ inputs.environment || 'production' }} for commit ${{ github.sha }}"

      - name: Validate Compose Architecture
        run: |
          docker compose -f infra/compose/docker-compose.prod.yml config
