# Production-Like Multi-Container Docker Compose Stack for MAX
version: '3.8'

services:
  reverse-proxy:
    image: caddy:2-alpine
    container_name: max-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - max-public
      - max-app
    depends_on:
      - backend
      - web
      - admin
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: max-web
    restart: always
    networks:
      - max-app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
    container_name: max-admin
    restart: always
    networks:
      - max-app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: max-backend
    restart: always
    environment:
      MAX_APPLICATION__ENVIRONMENT: production
      MAX_APPLICATION__DEBUG: "false"
      MAX_SERVER__HOST: 0.0.0.0
      MAX_SERVER__PORT: 8000
      MAX_INFRASTRUCTURE__DEPLOYMENT_TARGET: LOCAL_PROD
      MAX_INFRASTRUCTURE__DATABASE_URL: postgresql://max:maxprodpass@postgres:5432/maxdb
      MAX_INFRASTRUCTURE__REDIS_URL: redis://redis:6379/0
      MAX_INFRASTRUCTURE__STORAGE_ENDPOINT: http://minio:9000
    volumes:
      - max_logs:/app/logs
    networks:
      - max-app
      - max-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: max-worker
    restart: always
    environment:
      MAX_APPLICATION__ENVIRONMENT: production
      MAX_APPLICATION__DEBUG: "false"
      MAX_INFRASTRUCTURE__DATABASE_URL: postgresql://max:maxprodpass@postgres:5432/maxdb
      MAX_INFRASTRUCTURE__REDIS_URL: redis://redis:6379/0
    networks:
      - max-app
      - max-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scheduler
    container_name: max-scheduler
    restart: always
    environment:
      MAX_APPLICATION__ENVIRONMENT: production
      MAX_APPLICATION__DEBUG: "false"
      MAX_INFRASTRUCTURE__REDIS_URL: redis://redis:6379/0
    networks:
      - max-app
      - max-data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: max-postgres
    restart: always
    environment:
      POSTGRES_DB: maxdb
      POSTGRES_USER: max
      POSTGRES_PASSWORD: maxprodpass
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - max-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U max -d maxdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: max-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - max-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: max-minio
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_prod_data:/data
    networks:
      - max-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  max-public:
    driver: bridge
  max-app:
    driver: bridge
    internal: false
  max-data:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  max_logs:
